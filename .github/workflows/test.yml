name: Self-test

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Cache reference firmware
        id: cache-firmware
        uses: actions/cache@v4
        with:
          path: firmware
          key: firmware-43a77844f641368e3eabbfdac7675ca20d6d9932

      - name: Checkout reference firmware
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: jakobgif/Blinky_LED_1_KIT_TC375_LK
          ref: 43a77844f641368e3eabbfdac7675ca20d6d9932
          path: firmware

      - name: Build firmware
        uses: ./
        with:
          project-path: firmware
          configuration: Release

      - name: Compare output against reference
        shell: bash
        run: |
          HEX=$(find firmware -name "*.hex" | head -1)
          if [ -z "$HEX" ]; then
            echo "ERROR: no .hex file found"
            exit 1
          fi
          echo "Built: $HEX"
          if ! cmp -s "$HEX" test/reference.hex; then
            echo "ERROR: output hex differs from reference"
            diff <(xxd "$HEX" | head -20) <(xxd test/reference.hex | head -20) || true
            exit 1
          fi
          echo "OK: output matches reference"
