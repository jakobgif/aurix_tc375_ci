name: Generate AURIX TC375 Makefile
description: >
  Parses an AURIX TC375 Eclipse CDT / AURIX Development Studio .cproject and
  generates a GNU Makefile using the bundled TriCore GCC toolchain.
  The Makefile path is exposed as the `makefile-path` output so you can run
  `make` yourself (or with a generic make action) as a separate step.

inputs:
  project-path:
    description: >
      Path to the firmware repository root (the directory that contains
      .cproject and .project).
    required: true

  toolchain-path:
    description: >
      Path to the tricore-gcc11/bin directory.
      Defaults to the toolchain bundled with this action.
    required: false
    default: ${{ github.action_path }}/toolchain/tricore-gcc11/bin

  configuration:
    description: >
      Build configuration substring to match (e.g. "Release" or "Debug").
      The first GCC configuration whose name contains this substring is built.
    required: false
    default: Release

  extra-defines:
    description: >
      Space-separated extra preprocessor definitions injected at compile time,
      on top of whatever .cproject already specifies. Each entry may be a bare
      name (NAME) or a name=value pair (NAME=VALUE).
      Example: "MY_FLAG=1 ANOTHER_FLAG DEBUG_LEVEL=3"
    required: false
    default: ''

outputs:
  makefile-path:
    description: Absolute path to the generated Makefile.
    value: ${{ steps.gen.outputs.makefile }}

runs:
  using: composite
  steps:
    - name: Generate Makefile
      id: gen
      shell: bash
      run: |
        OUTPUT=$(python "${{ github.action_path }}/generate_makefiles.py" \
          --project   "${{ inputs.project-path }}" \
          --toolchain "${{ inputs.toolchain-path }}" \
          --config    "${{ inputs.configuration }}" \
          --extra-defines "${{ inputs.extra-defines }}")
        echo "$OUTPUT"
        MAKEFILE=$(echo "$OUTPUT" | grep '^MAKEFILE_CI=' | cut -d= -f2-)
        echo "makefile=$MAKEFILE" >> "$GITHUB_OUTPUT"
